<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="box">
    <h1 class="title">Welcome Back</h1>
    <p class="subtitle">Sign in to continue</p>

    <form>
      <label for="email" class="label">Email</label>
      <input type="email" id="email" name="email" class="input" placeholder="you@example.com" required>

      <label for="password" class="label">Password</label>
      <input type="password" id="password" name="password" class="input" placeholder="Password" required>

      <button type="submit" class="button">Sign In</button>
    </form>

    <p class="signup">Don't have an account? <a href="#" class="link">Sign up</a></p>
  </div>

</div>

</body>
</html>
