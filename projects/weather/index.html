<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1 class="title">Weather Dashboard</h1>
  <p class="subtitle">A static page, no live weather data. Just layout practice.</p>

  <div class="grid">

    <div class="card">
      <p class="city">Mumbai</p>
      <p class="icon">🌦️</p>
      <p class="temp">29°C</p>
      <p class="condition">Light Rain</p>
      <div class="stats">
        <span>💧 78%</span>
        <span>🌬️ 14 km/h</span>
      </div>
    </div>

    <div class="card blue">
      <p class="city">Bangalore</p>
      <p class="icon">⛅</p>
      <p class="temp">24°C</p>
      <p class="condition">Partly Cloudy</p>
      <div class="stats">
        <span>💧 55%</span>
        <span>🌬️ 9 km/h</span>
      </div>
    </div>

    <div class="card">
      <p class="city">Delhi</p>
      <p class="icon">☀️</p>
      <p class="temp">33°C</p>
      <p class="condition">Sunny</p>
      <div class="stats">
        <span>💧 30%</span>
        <span>🌬️ 6 km/h</span>
      </div>
    </div>

    <div class="card">
      <p class="city">Manali</p>
      <p class="icon">🌧️</p>
      <p class="temp">14°C</p>
      <p class="condition">Rainy</p>
      <div class="stats">
        <span>💧 88%</span>
        <span>🌬️ 18 km/h</span>
      </div>
    </div>

  </div>
</div>

</body>
</html>
